name: vibeqm-check
description: Run the Vibe Quality Model (VibeQM) fact checks on this repository and report every gate with evidence
inputs:
  path:
    description: "Path of the repository to check"
    default: "."
  min-level:
    description: "Fail the job when the level reached is below this number (0 never fails)"
    default: "0"
  proof:
    description: "Optional proof file for gates the tool can't see (default: vqm-proof.json found in the repo)"
    default: ""
  github-token:
    description: "Token for the read-only host checks (CI runs, merged pull requests). Needs actions: read and pull-requests: read; leave empty to read the repository only"
    default: ${{ github.token }}
  offline:
    description: "true: never ask the code host"
    default: "false"
outputs:
  level:
    description: "Highest level whose fact checks are all met"
    value: ${{ steps.run.outputs.level }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build vibeqm-check
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --silent && npm run build --silent
    - id: run
      name: Run the VibeQM fact checks
      shell: bash
      env:
        VQM_PATH: ${{ inputs.path }}
        VQM_MIN: ${{ inputs.min-level }}
        VQM_PROOF: ${{ inputs.proof }}
        VQM_OFFLINE_INPUT: ${{ inputs.offline }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        cli="${{ github.action_path }}/dist/src/cli.js"
        extra=(); [ -n "$VQM_PROOF" ] && extra=(--proof "$VQM_PROOF")
        [ "$VQM_OFFLINE_INPUT" = "true" ] && extra+=(--offline)
        node "$cli" "$VQM_PATH" "${extra[@]}" > "$RUNNER_TEMP/vqm-report.md"
        node "$cli" "$VQM_PATH" "${extra[@]}" --json > "$RUNNER_TEMP/vqm-report.json"
        # The step summary is for people: everything but the agent prompt, which
        # they can get by running the tool locally.
        awk '/^## Prompt for your AI coding agent/{exit} 1' "$RUNNER_TEMP/vqm-report.md" >> "$GITHUB_STEP_SUMMARY"
        echo "_The full report, including the prompt your AI coding agent can follow, is not shown here; run \`npx vibeqm-check\` in this repository for it._" >> "$GITHUB_STEP_SUMMARY"
        level=$(node -p "require(process.env.RUNNER_TEMP + '/vqm-report.json').level")
        echo "level=$level" >> "$GITHUB_OUTPUT"
        echo "VibeQM fact checks: level $level"
        if [ "$VQM_MIN" -gt 0 ] && [ "$level" -lt "$VQM_MIN" ]; then
          echo "::error::VibeQM level $level is below the required $VQM_MIN"
          exit 1
        fi
