# VibeQM Level 2: verification and a security review on every change.
# Make both jobs required status checks on the main branch (Settings → Branches →
# branch protection, or rulesets), so a failure blocks the merge.
name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Your build, tests, linter and static analysis. Uncomment the lines for your
      # stack, or write your own. Until one runs, this job checks nothing.
      #
      # Node:
      # - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      #   with: { node-version: 22 }
      # - run: npm ci && npm run lint && npm test
      # - run: npm audit --audit-level=critical
      #
      # Python:
      # - run: pipx run ruff check .
      # - run: pip install -r requirements.txt && pytest
      # - run: pipx run pip-audit -r requirements.txt
      #
      # Go:
      # - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      # - run: go vet ./... && go test ./...
  security:
    # Secret scanning over the whole history, and static security analysis.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1, checksum-verified (secret scanning)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - name: semgrep 1.180.0, pinned (static security analysis)
        run: pipx run --spec "semgrep==1.180.0" semgrep scan --config p/default --error --metrics=off .
