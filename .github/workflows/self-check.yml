name: self-check
on: [push, pull_request]
jobs:
  test-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read         # the host check reads this repository's CI runs
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the checks sample history; a shallow clone hides it
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci && npm test
      - id: vqm
        uses: ./
      - run: test -n "${{ steps.vqm.outputs.level }}"
      - name: the action read the host (CI runs, branch rules or pull requests; a gate attested by proof no longer shows its host evidence, so the whole report is searched)
        run: |
          node -e 'const t=JSON.stringify(require(process.env.RUNNER_TEMP+"/vqm-report.json").results); const m=t.match(/[^"]*(read from the host|CI run in the default branch.s last \d+ runs)[^"]*/); console.log(m ? m[0] : "no host evidence in the report"); process.exit(m ? 0 : 1)'
  security:
    # VibeQM Level 2: secret scanning and static security analysis on every change.
    # Read-only token; gitleaks verified against its published checksum, semgrep
    # pinned to an exact version (not hash-verified).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1, checksum-verified (secret scanning, whole history)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - name: semgrep 1.180.0, pinned (static security analysis)
        run: |
          pipx run --spec "semgrep==1.180.0" semgrep scan --config p/typescript --config p/nodejs --error --metrics=off src
      - name: dependency vulnerability scan (fails on critical findings)
        run: npm audit --audit-level=critical
