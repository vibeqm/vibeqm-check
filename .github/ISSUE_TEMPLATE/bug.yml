name: Bug
description: A crash, a wrong report, or the tool doing something it shouldn't
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: "npx vibeqm-check@0.4.11 --json in a repository with …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "vibeqm-check 0.4.11, Node 22, macOS"
    validations:
      required: true
